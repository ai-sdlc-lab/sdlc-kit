# project.yml: the answers /new-project needs (sdlc-kit v1).
#
# How to use: copy this file, fill in every field (a Claude Desktop session can do it from a description of
# the idea), then start Claude Code in your sdlc-kit folder and run `/new-project` with the filled-in file
# pasted after it (or its path). /new-project asks only about fields that are missing or invalid.
# The file is saved in the new repository as `project.yml`, the record of how it was set up.
#
# v1 builds the shape proven in ai-sdlc-lab/dogs-app: FastAPI (Python 3.14) + Vite/TypeScript, on AWS Lambda
# with a public function URL, region eu-north-1, lab account, free tier. Features beyond the starting point
# (storage, login, uploads, ...) are built afterwards through /stage; the answers under `product` tell the
# reviewers what is coming, so they apply the right security requirements from the first change.

kit: v1                 # sdlc-kit version to install (a tag of ai-sdlc-lab/sdlc-kit)

project:
  name: ""              # GitHub repository name: a-z, 0-9 and '-', 3-40 characters, starts with a letter,
                        #   not an existing repo (e.g. notes-app). Also names the AWS resources.
  title: ""             # name shown on the page, 1-40 characters (e.g. Notes)
  visibility: public    # public | private  (private repos on GitHub Free get no rulesets or secret
                        #   scanning: the lab's protections need public)
  description: ""       # one line, at most 120 characters, shown on GitHub
  purpose: ""           # 2-4 sentences: the problem, who uses it, why

product:                # what the app will become; goes into docs/architecture.md "Product direction"
  users: anonymous      # anonymous | authenticated
  auth: ""              # if authenticated: how users log in (e.g. "email login with Amazon Cognito"); else ""
  writes: false         # true if users will create, change, delete or upload anything
  stored_data: ""       # what the app will store (e.g. "notes: title and text per user"), or "none"
  personal_data: ""     # personal data it will hold (e.g. "email addresses"), or "none"
  external_services: [] # third-party hosts or APIs it will call, e.g. ["api.openweathermap.org"]

first_change: ""        # optional: one sentence, the first /stage run after setup (e.g. "list notes from S3")

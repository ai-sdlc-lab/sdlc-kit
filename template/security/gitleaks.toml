# gitleaks: default rules, plus one allowlist for review reports (read from the base branch in CI).
[extend]
useDefault = true

[[allowlists]]
description = "SHA-256 file hashes in stage review reports (scope hashes, not secrets)"
condition = "AND"
paths = ['''^docs/specs/[^/]+/reviews/[^/]+\.json$''']
regexes = ['''^[0-9a-f]{64}$''']
